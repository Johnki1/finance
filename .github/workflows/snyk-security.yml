name: Snyk Security Gate Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  security_audit:
    name: Snyk SAST & SCA Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Run Snyk Code Analysis (SAST)
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: code test
          args: --severity-threshold=high

      # SCA runs with the Snyk CLI directly on the runner instead of the
      # snyk/actions Docker image: the container inherits the runner's JAVA_HOME,
      # which points to a path that does not exist inside the image, so Maven
      # cannot resolve backend/pom.xml ("The JAVA_HOME environment variable is
      # not defined correctly"). On the runner, actions/setup-java provides a
      # valid JDK 21 so all five projects (including the Maven one) are scanned.
      - name: Run Snyk Open Source Analysis (SCA)
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          npm install --global snyk
          snyk test --all-projects --severity-threshold=high --exclude=android,ios